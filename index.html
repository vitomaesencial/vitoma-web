<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitoma - Vida que contiene vida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --verde-vitoma: #4A5D4E; --dorado-vitoma: #D4AF37; --blanco-hueso: #F9F8F2; }
        body { background-color: var(--blanco-hueso); min-height: 100vh; margin: 0; font-family: 'Georgia', serif; }
        
        #fondo-marca-agua {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-repeat: no-repeat; background-position: center;
            background-size: 80%; opacity: 0.05; z-index: -1; pointer-events: none;
        }

        /* Franja móvil superior */
        .franja-anuncios {
            background-color: var(--dorado-vitoma);
            color: white; font-size: 13px; font-weight: bold; padding: 5px 0;
            text-transform: uppercase; letter-spacing: 2px;
        }

        /* Estilos del Menú Móvil */
        #menu-mobile { display: none; }
        #menu-mobile.active { display: flex; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background: var(--verde-vitoma); padding: 20px; z-index: 100; border-top: 1px solid rgba(255,255,255,0.1); }

        .btn-nav {
            background: none; border: none; color: white; cursor: pointer;
            font-size: 18px; transition: opacity 0.3s; padding: 10px;
        }
        
        /* Contenido estilo Editorial */
        .prose-vitoma { max-width: 800px; margin: 0 auto; color: #333; line-height: 1.8; font-size: 1.1rem; }
        .prose-vitoma p { margin-bottom: 1.5rem; }
        .prose-vitoma hr { border: 0; border-top: 1px solid var(--dorado-vitoma); width: 50px; margin: 2rem auto; opacity: 0.5; }
    </style>
</head>
<body>

    <div id="fondo-marca-agua"></div>

    <div class="franja-anuncios overflow-hidden">
        <marquee scrollamount="5" id="texto-anuncio-val">Cargando novedades...</marquee>
    </div>

    <header class="bg-[#4A5D4E] text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between relative">
            
            <div class="w-1/3 md:w-1/4">
                <img id="logo-header" src="" alt="" class="h-12 md:h-16 w-auto object-contain cursor-pointer" onclick="location.reload()">
            </div>
            
            <nav class="hidden md:flex flex-grow justify-center">
                <div id="menu-dinamico" class="flex space-x-8"></div>
            </nav>

            <button class="md:hidden text-white" onclick="toggleMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" />
                </svg>
            </button>

            <div id="menu-mobile" class="md:hidden"></div>
            
            <div class="hidden md:block w-1/4"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 md:p-12">
        <div id="vista-seccion"></div>
    </main>

    <a href="https://wa.me/573007851872" target="_blank" class="fixed bottom-6 right-6 z-[9999] bg-[#25D366] text-white p-4 rounded-full shadow-2xl">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16"><path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/></svg>
    </a>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzQ-ots9PfkMOsQeU-OzI4-6J4kmraC0_jReiE00-Ul1YWnw_ccH0a9hz6Z--98jkQ/exec";
        let datosGlobales = {};

        function toggleMenu() { document.getElementById('menu-mobile').classList.toggle('active'); }

        async function inicializarApp() {
            try {
                const res = await fetch(API_URL);
                datosGlobales = await res.json();
                
                // Carga de Configuración
                const config = datosGlobales.config || [];
                const urlLogo = config.find(c => c.Parametro === 'url_logo')?.Valor;
                const urlFondo = config.find(c => c.Parametro === 'url_fondo')?.Valor;
                const txtAnuncio = config.find(c => c.Parametro === 'texto_anuncio')?.Valor;
                
                if(urlLogo) document.getElementById('logo-header').src = urlLogo;
                if(urlFondo) document.getElementById('fondo-marca-agua').style.backgroundImage = `url('${urlFondo}')`;
                if(txtAnuncio) document.getElementById('texto-anuncio-val').innerText = txtAnuncio;

                // Renderizar menús (Desktop y Mobile)
                const renderMenu = (idContainer) => {
                    document.getElementById(idContainer).innerHTML = datosGlobales.menu.map(m => 
                        `<button onclick="cambiarSeccion('${m.ID_Seccion}'); if('${idContainer}'==='menu-mobile') toggleMenu();" class="btn-nav">${m.Nombre}</button>`
                    ).join('');
                };
                renderMenu('menu-dinamico');
                renderMenu('menu-mobile');

                cambiarSeccion(datosGlobales.menu[0].ID_Seccion);
            } catch (e) { console.error("Error cargando Vitoma:", e); }
        }

        function cambiarSeccion(idSeccion) {
            const vista = document.getElementById('vista-seccion');
            const contenidoTexto = datosGlobales.secciones?.find(s => s.ID_Seccion === idSeccion);
            
            if (contenidoTexto) {
                vista.innerHTML = `
                    <div class="prose-vitoma">
                        <h1 class="text-4xl font-light mb-10 text-center text-[#4A5D4E] tracking-widest uppercase">${contenidoTexto.Titulo || ''}</h1>
                        <div class="text-justify">${contenidoTexto.Contenido}</div>
                    </div>
                `;
            } else {
                const productosFiltrados = datosGlobales.productos.filter(p => String(p.ID_Seccion) === String(idSeccion));
                vista.innerHTML = `
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-12">
                        ${productosFiltrados.map(p => `
                            <div class="bg-white p-6 md:p-8 flex flex-col h-full rounded-sm shadow-sm border border-gray-100 hover:shadow-lg transition-all">
                                <img src="${p.URL_Imagen}" class="w-full h-64 object-cover mb-6 rounded-sm" onerror="this.src='https://via.placeholder.com/500?text=Vitoma'">
                                <h3 class="text-2xl font-bold text-gray-900 mb-2">${p.Nombre}</h3>
                                <p class="text-[10px] text-[#D4AF37] font-black tracking-widest mb-4 uppercase">${p.Ingredientes || ''}</p>
                                <p class="text-sm text-gray-600 flex-grow italic leading-relaxed mb-6">${p.Funcion_Cuerpo || ''}</p>
                                <div class="mt-auto pt-4 border-t flex justify-between items-baseline font-light text-2xl text-[#4A5D4E]">
                                    <span>$${p.Precio}</span>
                                    <span class="text-xs font-bold text-gray-300">${p.Tamaño || ''}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            window.scrollTo(0,0);
        }
        inicializarApp();
    </script>
</body>
</html>
