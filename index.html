<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitoma - Vida que contiene vida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --verde-vitoma: #4A5D4E; --blanco-hueso: #F9F8F2; }
        body { background-color: var(--blanco-hueso); min-height: 100vh; position: relative; font-family: 'Helvetica Neue', sans-serif; }
        
        #fondo-marca-agua {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-repeat: no-repeat; background-position: center;
            background-size: 70%; opacity: 0.05; z-index: -1; pointer-events: none;
        }

        /* Estilo para los botones del menú */
        .btn-menu { 
            transition: all 0.3s ease; 
            padding: 5px 10px;
            white-space: nowrap;
        }
        .btn-menu:hover { 
            opacity: 0.7;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div id="fondo-marca-agua"></div>

    <header class="bg-[#4A5D4E] text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 grid grid-cols-3 items-center">
            
            <div class="flex justify-start">
                <img id="logo-header" src="" alt="" class="h-14 w-auto object-contain cursor-pointer" onclick="location.reload()">
            </div>
            
            <nav class="flex justify-center">
                <ul id="menu-dinamico" class="flex items-center space-x-10">
                    </ul>
            </nav>
            
            <div class="hidden md:block"></div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-10 md:p-16">
        <div id="vista-seccion" class="contenido-custom"></div>
    </main>

    <a href="https://wa.me/573007851872" target="_blank" 
       class="fixed bottom-8 right-8 z-[9999] bg-[#25D366] text-white p-4 rounded-full shadow-2xl hover:scale-110 transition-transform">
        <svg xmlns="http://www.w3.org/2000/svg" width="30" height="30" fill="currentColor" viewBox="0 0 16 16">
            <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
        </svg>
    </a>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzQ-ots9PfkMOsQeU-OzI4-6J4kmraC0_jReiE00-Ul1YWnw_ccH0a9hz6Z--98jkQ/exec";
        let datosGlobales = {};

        async function inicializarApp() {
            try {
                const res = await fetch(API_URL);
                datosGlobales = await res.json();
                
                const config = datosGlobales.config || [];
                const urlLogo = config.find(c => c.Parametro === 'url_logo')?.Valor;
                const urlFondo = config.find(c => c.Parametro === 'url_fondo')?.Valor;
                
                if(urlLogo) document.getElementById('logo-header').src = urlLogo;
                if(urlFondo) document.getElementById('fondo-marca-agua').style.backgroundImage = `url('${urlFondo}')`;

                // Renderizar Menú (innerHTML para aceptar el código del Excel)
                document.getElementById('menu-dinamico').innerHTML = datosGlobales.menu.map(m => 
                    `<li><button onclick="cambiarSeccion('${m.ID_Seccion}')" class="btn-menu">${m.Nombre}</button></li>`
                ).join('');

                cambiarSeccion(datosGlobales.menu[0].ID_Seccion);
            } catch (e) { console.error("Error:", e); }
        }

        function cambiarSeccion(idSeccion) {
            const vista = document.getElementById('vista-seccion');
            const contenidoTexto = datosGlobales.secciones?.find(s => s.ID_Seccion === idSeccion);
            
            if (contenidoTexto) {
                vista.innerHTML = `
                    <div class="max-w-3xl mx-auto">
                        <h1 class="text-4xl font-light mb-8 text-[#4A5D4E] border-b pb-4">${contenidoTexto.Titulo || ''}</h1>
                        <div class="prose prose-lg max-w-none text-gray-800 leading-relaxed">${contenidoTexto.Contenido}</div>
                    </div>
                `;
            } else {
                const productosFiltrados = datosGlobales.productos.filter(p => String(p.ID_Seccion) === String(idSeccion));
                vista.innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                        ${productosFiltrados.map(p => `
                            <div class="bg-white/80 backdrop-blur-md border border-gray-100 p-8 flex flex-col h-full rounded-lg shadow-sm hover:shadow-xl transition-all duration-300">
                                <img src="${p.URL_Imagen}" class="w-full h-56 object-cover mb-6 rounded-md shadow-inner">
                                <h3 class="text-2xl font-bold text-gray-900 mb-2">${p.Nombre}</h3>
                                <p class="text-[11px] text-[#4A5D4E] font-black tracking-[0.2em] mb-4 uppercase opacity-80">${p.Ingredientes || ''}</p>
                                <p class="text-sm text-gray-600 flex-grow leading-relaxed italic mb-6">${p.Funcion_Cuerpo || ''}</p>
                                <div class="mt-auto pt-6 border-t flex justify-between items-center font-light text-2xl text-[#4A5D4E]">
                                    <span>$${p.Precio}</span>
                                    <span class="text-xs font-bold text-gray-300 uppercase">${p.Tamaño || ''}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
        }
        inicializarApp();
    </script>
</body>
</html>
