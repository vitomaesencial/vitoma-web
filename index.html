<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitoma - Vida que contiene vida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --blanco-hueso: #F9F8F2;
            --azul-noche: #1A1B25;
            --dorado: #D4AF37;
        }
        body { background-color: var(--blanco-hueso); color: var(--azul-noche); }
    </style>
</head>
<body>

    <nav class="p-4 border-b bg-white/80 backdrop-blur-md sticky top-0 z-50">
        <ul id="menu-dinamico" class="flex justify-center space-x-8 text-xs uppercase tracking-widest font-bold">
            </ul>
    </nav>

    <header class="py-16 px-4 text-center">
        <h1 class="text-5xl font-light tracking-tighter uppercase mb-4">Vitoma</h1>
        <p class="italic text-gray-600">Vida que contiene vida</p>
    </header>

    <main id="contenedor-productos" class="max-w-6xl mx-auto p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
        </main>

    <script>
        // Tu URL de Google Apps Script
        const API_URL = "https://script.google.com/macros/s/AKfycbzQ-ots9PfkMOsQeU-OzI4-6J4kmraC0_jReiE00-Ul1YWnw_ccH0a9hz6Z--98jkQ/exec";

        async function inicializarApp() {
            const menuContenedor = document.getElementById('menu-dinamico');
            const productosContenedor = document.getElementById('contenedor-productos');

            productosContenedor.innerHTML = "<p class='col-span-full text-center'>Cargando catálogo...</p>";

            try {
                const res = await fetch(API_URL);
                const json = await res.json();
                
                // Renderizado de Menú
                menuContenedor.innerHTML = json.menu.map(m => {
                    const nombre = m.Nombre || "Sección";
                    const id = m.ID_Seccion || "inicio";
                    return `<li><a href="#${id}" class="hover:text-[#D4AF37] transition-colors">${nombre}</a></li>`;
                }).join('');

                // Renderizado de Productos
                productosContenedor.innerHTML = json.productos.map(p => `
                    <div class="bg-white border border-gray-100 p-6 shadow-sm hover:shadow-md transition-shadow rounded-sm flex flex-col h-full">
                        <img src="${p.URL_Imagen || 'https://via.placeholder.com/400x300?text=Vitoma+Producto'}" 
                             class="w-full h-64 object-cover mb-4 rounded-sm"
                             onerror="this.src='https://via.placeholder.com/400x300?text=Cargando+Imagen...'">
                        
                        <h2 class="text-2xl font-bold mb-1">${p.Nombre || 'Producto'}</h2>
                        <p class="text-[10px] text-[#D4AF37] font-black uppercase tracking-widest mb-4">
                            ${p.Ingredientes || 'Natural'}
                        </p>
                        
                        <p class="text-sm text-gray-700 leading-relaxed flex-grow">
                            ${p.Funcion_Cuerpo || ''}
                        </p>
                        
                        <div class="mt-6 pt-4 border-t flex justify-between items-baseline">
                            <span class="text-xl font-light">$${p.Precio || '0'}</span>
                            <span class="text-[10px] text-gray-400 font-bold uppercase">${p.Tamaño || ''}</span>
                        </div>
                    </div>
                `).join('');

            } catch (e) {
                console.error("Error técnico:", e);
                productosContenedor.innerHTML = "<p class='col-span-full text-center text-red-400'>Error al conectar con la base de datos.</p>";
            }
        }

        inicializarApp();
    </script>
</body>
</html>
