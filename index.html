<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vitoma - Vida que contiene vida</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --verde-vitoma: #4A5D4E; --dorado-vitoma: #D4AF37; --blanco-hueso: #F9F8F2; }
        body { background-color: var(--blanco-hueso); min-height: 100vh; margin: 0; font-family: 'Helvetica Neue', sans-serif; overflow-x: hidden; }
        #fondo-marca-agua { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-repeat: no-repeat; background-position: center; background-size: 80%; opacity: 0.05; z-index: -1; pointer-events: none; }
        .franja-anuncios { background-color: var(--dorado-vitoma); color: white; font-size: 12px; font-weight: bold; padding: 6px 0; text-transform: uppercase; letter-spacing: 2px; }
        #menu-mobile { display: none; transition: 0.3s; }
        #menu-mobile.active { display: flex; flex-direction: column; position: absolute; top: 100%; left: 0; width: 100%; background: var(--verde-vitoma); padding: 20px; z-index: 100; }
        .btn-nav { background: none; border: none; color: white; cursor: pointer; font-size: 17px; font-weight: 500; padding: 10px; transition: 0.3s; }
        .btn-nav:hover { color: var(--dorado-vitoma); }
        .prose-vitoma { max-width: 800px; margin: 0 auto; line-height: 1.8; }
        .prose-vitoma h1 { color: var(--verde-vitoma); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 2rem; text-align: center; font-size: 2.5rem; }
    </style>
</head>
<body>
    <div id="fondo-marca-agua"></div>
    <div class="franja-anuncios overflow-hidden"><marquee scrollamount="6" id="texto-anuncio-val">Cargando...</marquee></div>

    <header class="bg-[#4A5D4E] text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between relative">
            <div class="w-1/3 md:w-1/4">
                <img id="logo-header" src="" class="h-14 w-auto object-contain cursor-pointer" onclick="window.location.hash=''; location.reload();">
            </div>
            <nav class="hidden md:flex flex-grow justify-center"><div id="menu-dinamico" class="flex space-x-10"></div></nav>
            <button class="md:hidden text-white" onclick="toggleMenu()"><svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg></button>
            <div id="menu-mobile" class="md:hidden shadow-xl"></div>
            <div class="hidden md:block w-1/4"></div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto p-6 md:p-14"><div id="vista-seccion"></div></main>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzQ-ots9PfkMOsQeU-OzI4-6J4kmraC0_jReiE00-Ul1YWnw_ccH0a9hz6Z--98jkQ/exec";
        let datosGlobales = {};

        function toggleMenu() { document.getElementById('menu-mobile').classList.toggle('active'); }

        async function inicializarApp() {
            try {
                const res = await fetch(API_URL);
                datosGlobales = await res.json();
                
                // Configuración (Limpieza de espacios para asegurar carga)
                const config = datosGlobales.config || [];
                const getVal = (p) => config.find(c => c.Parametro.trim().toLowerCase() === p.toLowerCase())?.Valor;

                if(getVal('url_logo')) document.getElementById('logo-header').src = getVal('url_logo');
                if(getVal('url_fondo')) document.getElementById('fondo-marca-agua').style.backgroundImage = `url('${getVal('url_fondo')}')`;
                if(getVal('texto_anuncio')) document.getElementById('texto-anuncio-val').innerText = getVal('texto_anuncio');

                // Menús
                const html = datosGlobales.menu.map(m => `<button onclick="navegar('${m.ID_Seccion.trim()}')" class="btn-nav">${m.Nombre}</button>`).join('');
                document.getElementById('menu-dinamico').innerHTML = html;
                document.getElementById('menu-mobile').innerHTML = html;

                // Cargar según URL o por defecto
                const hash = window.location.hash.replace('#', '');
                navegar(hash || datosGlobales.menu[0].ID_Seccion.trim());

            } catch (e) { console.error("Error:", e); }
        }

        function navegar(id) {
            window.location.hash = id; // Esto cambia la URL a .../#nosotros
            cambiarSeccion(id);
            if(window.innerWidth < 768) document.getElementById('menu-mobile').classList.remove('active');
        }

        function cambiarSeccion(id) {
            const vista = document.getElementById('vista-seccion');
            const sec = datosGlobales.secciones?.find(s => s.ID_Seccion.trim().toLowerCase() === id.toLowerCase());
            
            if (sec) {
                vista.innerHTML = `<div class="prose-vitoma animate-fade-in"><h1>${sec.Titulo || ''}</h1><div class="text-justify text-lg text-gray-700">${sec.Contenido}</div></div>`;
            } else {
                const prods = datosGlobales.productos.filter(p => p.ID_Seccion.trim().toLowerCase() === id.toLowerCase());
                vista.innerHTML = `<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-10">
                    ${prods.map(p => `
                        <div class="bg-white p-6 md:p-8 flex flex-col h-full rounded-sm shadow-sm border border-gray-100 hover:shadow-xl transition-all">
                            <img src="${p.URL_Imagen}" class="w-full h-64 object-cover mb-6" onerror="this.style.display='none'">
                            <h3 class="text-2xl font-bold text-gray-900 mb-2">${p.Nombre}</h3>
                            <p class="text-[10px] text-[#D4AF37] font-black tracking-widest mb-4 uppercase">${p.Ingredientes || ''}</p>
                            <p class="text-sm text-gray-600 flex-grow italic mb-6">${p.Funcion_Cuerpo || ''}</p>
                            <div class="mt-auto pt-4 border-t flex justify-between items-baseline font-light text-2xl text-[#4A5D4E]">
                                <span>$${p.Precio}</span><span class="text-xs font-bold text-gray-300 uppercase">${p.Tamaño || ''}</span>
                            </div>
                        </div>`).join('')}</div>`;
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        inicializarApp();
    </script>
</body>
</html>
